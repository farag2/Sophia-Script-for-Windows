name: Download HEVC

on:
  workflow_dispatch:

permissions:
  contents: write

# Do not push from several workflows at the same time
concurrency:
  group: update-repository-files
  cancel-in-progress: false

jobs:
  download-hevc:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download HEVC package
        run: |
          . "Scripts\Download_HEVC.ps1"

      - name: Commit and push changes
        run: |
          # Save Microsoft.HEVCVideoExtension_8wekyb3d8bbwe.appx to HEVC folder
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add HEVC/Microsoft.HEVCVideoExtension_8wekyb3d8bbwe.appxbundle
          git add HEVC/HEVC_version.txt
          git commit -m "Update Microsoft.HEVCVideoExtension_8wekyb3d8bbwe.appxbundle"
          git pull --rebase
          git push
