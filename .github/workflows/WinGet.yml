name: WinGet push

on:
  workflow_dispatch:

jobs:
  WinGet:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Sync fork
        env:
          GITHUB_TOKEN: ${{ secrets.WINGET_PAT }}
        run: |
          gh repo sync farag2/winget-pkgs --source microsoft/winget-pkgs --branch master --force

      - name: Preparation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          . "Scripts\WinGet\WinGet.ps1"

      - name: Publish to WinGet
        env:
          WINGET_PAT: ${{ secrets.WINGET_PAT }}
        run: |
          # %LOCALAPPDATA%\Microsoft\WinGet\Packages
          # Get the latest wingetcreate
          # https://github.com/microsoft/winget-create
          # https://github.com/microsoft/winget-pkgs/blob/main/Tools/YamlCreate.ps1
          $Parameters = @{
            Uri             = "https://aka.ms/wingetcreate/latest"
            OutFile         = "wingetcreate.exe"
            UseBasicParsing = $true
          }
          Invoke-WebRequest @Parameters

          .\wingetcreate.exe submit --prtitle "New Version: TeamSophia.SophiaScript version $env:LatestRelease" --token $env:WINGET_PAT "Scripts\WinGet\WinGet_Manifests"
