name: Build

on: 
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true

jobs:
  build-sophia:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download Dependencies
        run: |
          . "Scripts\Building\Dependencies.ps1"

      - name: Build
        run: |
          . "Scripts\Building\Build.ps1"

      # Sophia.Script.for.Windows.11.v*_WinGet.exe: C# launcher with the Windows 11 release archive inside
      # It isn't signed yet: signing will be added from SignPath_Test.yml when the release certificate is issued
      - name: WinGet launcher
        run: |
          . "Scripts\Building\WinGet_Launcher.ps1"

      - name: VirusTotal check
        env:
          VirusTotal_API_Key: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          . "Scripts\VirusTotal.ps1"

      - name: Release Notes Template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          . "Scripts\ReleaseNotesTemplate.ps1"

      - name: Uploading
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $Tag    = "${{ inputs.tag }}"
          $Assets = @((Get-Item -Path "Sophia_Script\Sophia*.zip", "Sophia_Script\Sophia*_WinGet.exe").FullName)
          $Title  = $env:RELEASE_NAME

          gh release create $Tag $Assets --title $Title --notes-file ReleaseNotesTemplate.md