name: Build

on: 
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag"
        required: true

env:
  SIGNPATH_SIGNING_POLICY_SLUG: release-signing

jobs:
  build-sophia:
    runs-on: windows-latest
    # Must be longer than wait-for-completion-timeout-in-seconds of the SignPath step
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Check release tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          # WinGet, Chocolatey, and Gallery workflows build download URLs from the Windows 11 version, so the release tag must be the same
          # https://github.com/farag2/Sophia-Script-for-Windows/blob/main/Sophia_Script_Releases.json
          $Version = (Get-Content -Path "Sophia_Script_Releases.json" -Raw | ConvertFrom-Json).Sophia_Script_Windows_11

          if ($env:INPUT_TAG -ne $Version)
          {
              Write-Warning -Message "Release tag $($env:INPUT_TAG) doesn't match the Sophia_Script_Windows_11 version $Version in Sophia_Script_Releases.json."

              # Exit with a non-zero status to fail the job
              exit 1
          }

      - name: Build
        run: |
          # Dependencies and archives
          . "Scripts\Building\Build.ps1"

      - name: WinGet launcher
        id: winget
        run: |
          # Sophia.Script.for.Windows.11.v*_WinGet.exe is attached to the release and downloaded by Scripts\WinGet\WinGet.ps1
          . "Scripts\Building\WinGet_Launcher.ps1"

      # SignPath takes the file to sign from the workflow artifacts only
      - name: Upload unsigned WinGet launcher
        id: upload-unsigned
        uses: actions/upload-artifact@main
        with:
          name: WinGet_unsigned
          path: Sophia_Script/Sophia.Script.for.Windows.11.v${{ steps.winget.outputs.version }}_WinGet.exe

      # https://docs.signpath.io/trusted-build-systems/github
      # Artifact configuration: Scripts/SignPath/WinGet.xml
      # Every release signing request must be approved manually in the SignPath UI, so the step waits for the approval
      - name: Sign WinGet launcher with SignPath (release-signing)
        id: signpath
        uses: signpath/github-action-submit-signing-request@main
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          # Used by the artifact configuration for the file name and the product-version restriction. The value must be a JSON string
          parameters: |
            version: ${{ toJSON(steps.winget.outputs.version) }}
          wait-for-completion: true
          # Time to approve the signing request in the SignPath UI: 2 hours. 10 minutes by default
          wait-for-completion-timeout-in-seconds: 7200
          output-artifact-directory: ${{ runner.temp }}/SignPath

      - name: Signing request link
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "SignPath signing request: ${{ steps.signpath.outputs.signing-request-web-url }}"

      - name: Check signed WinGet launcher
        env:
          SIGNED_ARTIFACT_DIRECTORY: ${{ runner.temp }}/SignPath
        run: |
          # The job fails if the signature isn't valid. The signed launcher replaces the unsigned one in the Sophia_Script folder
          . "Scripts\Building\WinGet_Launcher.ps1" -Signed

      - name: VirusTotal check
        env:
          VirusTotal_API_Key: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          . "Scripts\VirusTotal.ps1"

      - name: Release Notes Template
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          . "Scripts\ReleaseNotesTemplate.ps1"

      - name: Uploading
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $Tag    = $env:INPUT_TAG
          $Assets = @((Get-Item -Path "Sophia_Script\Sophia*.zip", "Sophia_Script\Sophia*_WinGet.exe").FullName)
          $Title  = $env:RELEASE_NAME

          gh release create $Tag $Assets --title $Title --notes-file ReleaseNotesTemplate.md
