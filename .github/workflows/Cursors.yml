name: Download cursors

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-cursors:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Download cursors
        env:
          DEVIANTART_CLIENT_ID: ${{ secrets.DEVIANTART_CLIENT_ID }}
          DEVIANTART_CLIENT_SECRET: ${{ secrets.DEVIANTART_CLIENT_SECRET }}
          DEVIANTART_TOKEN: ${{ secrets.DEVIANTART_TOKEN }}
          GH_TOKEN: ${{ secrets.CURSOR_PAT }}
        run: |
          . "Scripts\Download_Cursors.ps1"

      - name: Commit and push changes
        run: |
          # Save w11-cursor-concept-free.zip to Cursors folder
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

          git add Cursors/w11-cursor-concept-free.zip
          git commit -m "Update w11-cursor-concept-free.zip archive"
          git push
