name: Gallery push

on:
  workflow_dispatch:

jobs:
  Gallery:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@main

      - name: Publish to Gallery
        shell: pwsh
        env:
          GALLERY_KEY: ${{ secrets.GALLERY_KEY }}
        run: |
          # https://www.powershellgallery.com/packages/SophiaScript

          $Headers = @{
              Accept        = "application/vnd.github+json"
              Authorization = "Bearer $env:GITHUB_TOKEN"
          }

          # Get latest version tag for Windows 11
          # https://github.com/farag2/Sophia-Script-for-Windows/blob/main/Sophia_Script_Releases.json
          $Parameters = @{
              Uri             = "https://raw.githubusercontent.com/farag2/Sophia-Script-for-Windows/refs/heads/main/Sophia_Script_Releases.json"
              UseBasicParsing = $true
              Verbose         = $true
          }
          $JSON = (Invoke-RestMethod @Parameters).Sophia_Script_Windows_11

          $DownloadsFolder = Get-ItemPropertyValue -Path "HKCU:\Software\Microsoft\Windows\CurrentVersion\Explorer\User Shell Folders" -Name "{374DE290-123F-4565-9164-39C4925E467B}"
          $Parameters = @{
              Uri             = "https://github.com/farag2/Sophia-Script-for-Windows/releases/download/$($JSON)/Sophia.Script.for.Windows.11.v$($JSON).zip"
              OutFile         = "$DownloadsFolder\Sophia.Script.for.Windows.11.v$($JSON).zip"
              UseBasicParsing = $true
              Verbose         = $true
          }
          $Request = Invoke-WebRequest @Parameters

          $Parameters = @{
              Path            = "$DownloadsFolder\Sophia.Script.for.Windows.11.v$($JSON).zip"
              DestinationPath = $DownloadsFolder
              Force           = $true
          }
          Expand-Archive @Parameters

          $Parameters = @{
              Path       = "$DownloadsFolder\Sophia_Script_for_Windows_11_v$($JSON)"
              ApiKey     = $env:GALLERY_KEY
              Repository = "PSGallery"
              Verbose    = $true
          }
          Publish-PSResource @Parameters
